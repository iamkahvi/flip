}

* {

}

html,
body {

  min-height: 100%;
  margin: 0;
}

.viewer {
  position: relative;
  width: 100vw;
  width: 100dvw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #111;
}

.image {

  display: block;
  min-width: 0;
  min-height: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.position {
  position: fixed;
  z-index: 1;
  top: max(0.75rem, env(safe-area-inset-top));
  left: max(0.75rem, env(safe-area-inset-left));
  margin: 0;
  font-size: 0.75rem;
  line-height: 1;
  text-shadow: 0 1px 3px #000;
}
    </style>

let currentIndex = 0;

function indexFromHash() {
  const position = Number.parseInt(window.location.hash.slice(1), 10);
  const index = position - 1;
  return Number.isInteger(index) && index >= 0 && index < assets.length ? index : 0;
}

function updateHash() {
  const url = new URL(window.location.href);
  url.hash = String(currentIndex + 1);
  history.replaceState(null, "", url);
}

function preload(index) {
  if (index < 0 || index >= assets.length) return;
  const preloadImage = new Image();
  preloadImage.src = assets[index];
}

function render() {
  const assetUrl = assets[currentIndex];
  const assetName = decodeURIComponent(new URL(assetUrl).pathname.split("/").pop());

  image.removeAttribute("src");
  image.alt = assetName;
  image.src = assetUrl;
  position.textContent = `${currentIndex + 1} / ${assets.length}`;
  updateHash();

  preload(currentIndex - 1);
  preload(currentIndex + 1);
}

function goTo(index) {
  if (index < 0 || index >= assets.length || index === currentIndex) return;
  currentIndex = index;
  render();
}

function toggleFullscreen() {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen();
  }
}

image.addEventListener("error", () => {
  console.error(`Could not load ${image.src}`);
});

window.addEventListener("keydown", (event) => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;

  if (event.key === "ArrowLeft") {
    event.preventDefault();
    goTo(currentIndex - 1);
  } else if (event.key === "ArrowRight") {
    event.preventDefault();
    goTo(currentIndex + 1);
  } else if (event.key === "Home") {
    event.preventDefault();
    goTo(0);
  } else if (event.key === "End") {
    event.preventDefault();
    goTo(assets.length - 1);
  } else if (event.key.toLowerCase() === "f") {
    toggleFullscreen();
  }
});

window.addEventListener("hashchange", () => {
  const targetIndex = indexFromHash();
  if (targetIndex !== currentIndex) {
    currentIndex = targetIndex;
    render();
  }
});

if (assets.length === 0) {
  position.textContent = "No images in the inventory";
} else {
  currentIndex = indexFromHash();
  render();
}
