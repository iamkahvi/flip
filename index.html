<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <title>flip</title>
    <style>
:root {
  color-scheme: dark;
  font-family: monospace;
  background: #111;
  color: #f4f4f4;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

.viewer {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100vw;
  width: 100dvw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #111;
}

.image-stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
}

.image {
  position: absolute;
  inset: 0;
  display: block;
  min-width: 0;
  min-height: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.caption {
  position: absolute;
  z-index: 1;
  bottom: 0;
  left: 0;
  width: fit-content;
  max-width: min(90vw, 120ch);
  color: #111;
}

.caption[hidden] {
  display: none;
}

.caption-text {
  display: inline;
  margin: 0;
  background: #fff;
  font-size: clamp(1rem, 2vw, 1.75rem);
  line-height: 1.2;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

.caption-input {
  display: block;
  width: fit-content;
  max-width: min(90vw, 120ch);
  min-width: 1ch;
  min-height: 1.2em;
  margin: 0;
  padding: 0;
  border: 0;
  background: #fff;
  color: #111;
  field-sizing: content;
  resize: none;
  overflow: hidden;
  font: inherit;
  font-size: clamp(1rem, 2vw, 1.75rem);
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.caption-input[hidden] {
  display: none;
}

.caption-input:focus {
  outline: 1px solid #111;
  outline-offset: -1px;
}

.position {
  position: fixed;
  z-index: 1;
  top: max(0.75rem, env(safe-area-inset-top));
  left: max(0.75rem, env(safe-area-inset-left));
  margin: 0;
  font-size: 0.75rem;
  line-height: 1;
  text-shadow: 0 1px 3px #000;
}

    </style>
  </head>
  <body>
    <main id="viewer" class="viewer" aria-label="flip image viewer">
      <div class="image-stage">
        <img id="image" class="image" alt="" />
      </div>
      <section id="caption" class="caption" aria-label="Image subtitle" hidden>
        <p id="caption-text" class="caption-text"></p>
        <textarea id="caption-input" class="caption-input" aria-label="Subtitle for this image" hidden></textarea>
      </section>
      <p id="position" class="position" aria-live="polite"></p>
    </main>
    <script>
const viewer = document.querySelector("#viewer");
const image = document.querySelector("#image");
const position = document.querySelector("#position");
const caption = document.querySelector("#caption");
const captionText = document.querySelector("#caption-text");
const captionInput = document.querySelector("#caption-input");
const defaultManifestUrl = "manifest.json";
const manifestStorageKey = "flip:manifest-url";
const supportedAssetExtensions = /\.(avif|gif|jpe?g|png|svg|webp)$/i;
let assets = [];
let captions = {};
const captionMode = new URLSearchParams(window.location.search).get("mode") === "caption";

function configuredManifestUrl() {
  const fromQuery = new URLSearchParams(window.location.search).get("manifest");
  if (fromQuery) return fromQuery;
  try {
    return localStorage.getItem(manifestStorageKey) || defaultManifestUrl;
  } catch {
    return defaultManifestUrl;
  }
}

function isSupportedAssetUrl(url) {
  try {
    return supportedAssetExtensions.test(new URL(url).pathname);
  } catch {
    return false;
  }
}

const manifestUrl = configuredManifestUrl();
const captionsStorageKey = "flip:captions";
const localCaptions = captionMode ? loadCaptions() : {};
let currentIndex = 0;
let isEditingCaption = false;

function loadCaptions() {
  try {
    const savedCaptions = JSON.parse(localStorage.getItem(captionsStorageKey));
    return savedCaptions && typeof savedCaptions === "object" && !Array.isArray(savedCaptions)
      ? savedCaptions
      : {};
  } catch {
    return {};
  }
}

function saveCaptions() {
  try {
    localStorage.setItem(captionsStorageKey, JSON.stringify(localCaptions));
  } catch {
    // Caption mode still works until the page is reloaded if browser storage is unavailable.
  }
}

async function loadManifest() {
  const response = await fetch(manifestUrl, { cache: "no-store" });
  if (!response.ok) throw new Error(`Could not load manifest: ${response.status} ${response.statusText}`);

  const manifest = await response.json();
  if (!Array.isArray(manifest)) throw new Error("Manifest must be an array");

  const nextAssets = [];
  const nextCaptions = {};
  for (const [index, entry] of manifest.entries()) {
    if (!entry || typeof entry !== "object" || typeof entry.url !== "string") {
      throw new Error(`Invalid manifest entry ${index + 1}`);
    }
    if (!isSupportedAssetUrl(entry.url)) {
      console.warn(`Skipping unsupported image URL: ${entry.url}`);
      continue;
    }
    if (Object.hasOwn(entry, "caption") && typeof entry.caption !== "string") {
      throw new Error(`Invalid caption for manifest entry ${index + 1}`);
    }
    nextAssets.push(entry.url);
    if (Object.hasOwn(entry, "caption")) nextCaptions[entry.url] = entry.caption;
  }

  assets = nextAssets;
  captions = nextCaptions;
}

function currentCaption() {
  return currentCaptionFor(assets[currentIndex]);
}

function renderCaption() {
  const text = currentCaption();
  captionText.textContent = text;
  captionText.hidden = captionMode && isEditingCaption;
  captionInput.hidden = !captionMode || !isEditingCaption;
  caption.hidden = captionMode ? !isEditingCaption && text.length === 0 : text.length === 0;
}

function indexFromHash() {
  const position = Number.parseInt(window.location.hash.slice(1), 10);
  const index = position - 1;
  return Number.isInteger(index) && index >= 0 && index < assets.length ? index : 0;
}

function updateHash() {
  const url = new URL(window.location.href);
  url.hash = String(currentIndex + 1);
  history.replaceState(null, "", url);
}

function preload(index) {
  if (index < 0 || index >= assets.length) return;
  const preloadImage = new Image();
  preloadImage.src = assets[index];
}

function render() {
  const assetUrl = assets[currentIndex];
  const assetName = decodeURIComponent(new URL(assetUrl).pathname.split("/").pop());

  image.removeAttribute("src");
  image.alt = assetName;
  image.src = assetUrl;
  position.textContent = `${currentIndex + 1} / ${assets.length}`;
  if (captionMode) captionInput.value = currentCaption();
  renderCaption();
  updateHash();

  preload(currentIndex - 1);
  preload(currentIndex + 1);
}

function goTo(index) {
  if (index < 0 || index >= assets.length || index === currentIndex) return;
  currentIndex = index;
  render();
}

function toggleFullscreen() {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen();
  }
}

function saveCurrentCaption() {
  if (!captionMode) return;
  localCaptions[assets[currentIndex]] = captionInput.value.trim();
  saveCaptions();
}

function startCaptionEditing() {
  if (!captionMode) return;
  isEditingCaption = true;
  captionInput.value = currentCaption();
  renderCaption();
  captionInput.focus();
}

function exportManifest() {
  const exportedManifest = assets.map((url) => {
    const entry = { url };
    const text = currentCaptionFor(url).trim();
    if (text) entry.caption = text;
    return entry;
  });

  const blob = new Blob([`${JSON.stringify(exportedManifest, null, 2)}\n`], {
    type: "application/json"
  });
  const download = document.createElement("a");
  download.href = URL.createObjectURL(blob);
  download.download = "manifest.json";
  download.click();
  URL.revokeObjectURL(download.href);
}

function currentCaptionFor(assetUrl) {
  if (captionMode && Object.hasOwn(localCaptions, assetUrl)) {
    return localCaptions[assetUrl];
  }
  return captions[assetUrl] || "";
}


image.addEventListener("error", () => {
  console.error(`Could not load ${image.src}`);
});

viewer.addEventListener("pointerdown", (event) => {
  if (captionMode) return;
  goTo(event.clientX < window.innerWidth / 2 ? currentIndex - 1 : currentIndex + 1);
});

window.addEventListener("keydown", (event) => {
  if (captionMode && (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
    event.preventDefault();
    saveCurrentCaption();
    exportManifest();
    return;
  }
  if (event.altKey || event.ctrlKey || event.metaKey) return;

  if (event.target === captionInput) {
    if (event.key === "Escape") {
      event.preventDefault();
      saveCurrentCaption();
      isEditingCaption = false;
      captionInput.blur();
      renderCaption();
    }
    return;
  }

  if (event.key === "ArrowLeft" || event.key.toLowerCase() === "h") {
    event.preventDefault();
    goTo(currentIndex - 1);
  } else if (event.key === "ArrowRight" || event.key.toLowerCase() === "l") {
    event.preventDefault();
    goTo(currentIndex + 1);
  } else if (event.key === "Home") {
    event.preventDefault();
    goTo(0);
  } else if (event.key === "End") {
    event.preventDefault();
    goTo(assets.length - 1);
  } else if (event.key.toLowerCase() === "f") {
    toggleFullscreen();
  } else if (captionMode && event.key.toLowerCase() === "c") {
    event.preventDefault();
    startCaptionEditing();
  }
});

window.addEventListener("hashchange", () => {
  const targetIndex = indexFromHash();
  if (targetIndex !== currentIndex) {
    currentIndex = targetIndex;
    render();
  }
});

async function initialize() {
  try {
    await loadManifest();
    if (assets.length === 0) {
      position.textContent = "No images in the manifest";
    } else {
      currentIndex = indexFromHash();
      render();
    }
  } catch (error) {
    console.error(error);
    position.textContent = "Could not load image manifest";
  }
}

initialize();
    </script>
  </body>
</html>
